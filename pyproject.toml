[project]
name = "qos"
version = "0.1.1"
description = "QOS - the Quant Operating System: engine, local API and command-line tools"
readme = "README.md"
license = "AGPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43",
    "databricks-sdk>=0.155.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ib-async>=2.1.0,<3",
    "joblib>=1.6.0",
    "keyring>=25",
    "mcp[cli]>=2.3.0",
    "nautilus-trader[ib]==1.230.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0,<9",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
qos = "qos.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["nautilus_trader", "scripts", "data", ".venv"]
filterwarnings = [
    "ignore:Timestamp.utcnow is deprecated:DeprecationWarning",
    "ignore:Timestamp.utcnow is deprecated:FutureWarning",
    "ignore:Timestamp.utcnow is deprecated",
]

[tool.uv.build-backend]
module-name = "qos"
module-root = ""
