[project]
name = "qos-sdk"
version = "0.1.6"
description = "Write, test and package trading strategies for QOS (Quant Operating System) — same Nautilus backtest engine as QOS"
readme = "README.md"
license = "AGPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-AGPL", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "nautilus-trader==1.230.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "joblib>=1.4",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5"]
test = ["pytest>=8"]

[project.scripts]
qos = "qos.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The wheel packages ../qos and ../qx_strategies directly (the same code QOS runs).
# qos/sdk and qos/templates are Apache-2.0; the rest is AGPL-3.0-only with the QOS Agent Exception (see NOTICE).
# Build: cd qos_sdk && uv build --wheel -o dist
[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel.force-include]
"../qos" = "qos"
"../qx_strategies" = "qx_strategies"
