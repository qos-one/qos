name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04          # pin the image: ubuntu-latest is moving to 26.04 (Oct 2026)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Example strategies used by the tests
        uses: actions/checkout@v5
        with:
          repository: qos-one/qos-examples
          path: _examples

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen

      - name: Byte-compile all modules
        run: uv run python -m compileall -q api scripts mcp_server.py nautilus_runner.py

      - name: Tests
        run: uv run pytest
        env:
          QOS_EXAMPLES: ${{ github.workspace }}/_examples
